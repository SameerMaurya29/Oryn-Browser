<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"><title>History — Oryn</title><style>body{margin:0;background:#fdf6f6;color:#5d4c4d;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:850px;margin:auto;padding:48px 30px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.4px;color:#a85a40}.head{display:flex;align-items:end;justify-content:space-between}.head h1{font:48px Georgia,serif;margin:12px 0}.search{width:100%;padding:14px;border:1px solid #ead9d9;border-radius:12px;background:#fff;margin:28px 0;outline:0;font:inherit}.visit{display:block;padding:16px 0;border-top:1px solid #ead9d9;color:inherit;text-decoration:none}.visit:hover{background:#f8eeee}.visit b,.visit small{display:block}.visit small{color:#9b8588;margin-top:5px}.clear{border:1px solid #d9b8bd;background:#fff;border-radius:9px;padding:9px 13px;color:#a45f69;cursor:pointer}</style></head><body><main class="page"><div class="head"><div><span class="eyebrow">ORYN / LIBRARY</span><h1>History</h1></div><button class="clear" id="clear">Clear history</button></div><input id="search" class="search" placeholder="Search history"><section id="list">Loading…</section></main><script>let visits=[];const list=document.querySelector('#list'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),safeUrl=v=>/^https?:\/\//i.test(String(v||''))?String(v):'#';function render(){const q=document.querySelector('#search').value.toLowerCase();const rows=visits.filter(v=>(String(v.title||'')+' '+String(v.url||'')).toLowerCase().includes(q));list.innerHTML=rows.length?rows.map(v=>`<a class="visit" href="${esc(safeUrl(v.url))}"><b>${esc(v.title||'Untitled page')}</b><small>${esc(v.url)} · ${esc(new Date(v.time).toLocaleString())}</small></a>`).join(''):'<p style="color:#9b8588">No matching visits.</p>'}window.oryn.getHistory().then(v=>{visits=Array.isArray(v)?v:[];render()}).catch(()=>{visits=[];render()});document.querySelector('#search').oninput=render;document.querySelector('#clear').onclick=async()=>{await window.oryn.clearHistory();visits=[];render()};</script></body></html>
