{"name":"Build and publish Oryn release","on":{"push":{"tags":["v*"]}},"permissions":{"contents":"write"},"jobs":{"build":{"name":"Build ${{ matrix.name }}","runs-on":"${{ matrix.os }}","strategy":{"fail-fast":false,"matrix":{"include":[{"name":"macOS Apple Silicon","os":"macos-14","command":"npm run dist:mac-arm64","artifact":"macos-arm64","path":"dist/*.dmg\ndist/*.dmg.blockmap"},{"name":"macOS Intel","os":"macos-14","command":"npm run dist:mac-x64","artifact":"macos-x64","path":"dist/*.dmg\ndist/*.dmg.blockmap"},{"name":"Windows x64","os":"windows-2022","command":"npm run dist:win-x64","artifact":"windows-x64","path":"dist/*.exe\ndist/*.exe.blockmap"},{"name":"Windows ARM64","os":"windows-2022","command":"npm run dist:win-arm64","artifact":"windows-arm64","path":"dist/*.exe\ndist/*.exe.blockmap"},{"name":"Linux x64","os":"ubuntu-22.04","command":"npm run dist:linux-x64","artifact":"linux-x64","path":"dist/*.AppImage\ndist/*.deb\ndist/*.yml"},{"name":"Linux ARM64","os":"ubuntu-22.04","command":"npm run dist:linux-arm64","artifact":"linux-arm64","path":"dist/*.AppImage\ndist/*.deb\ndist/*.yml"}]}},"steps":[{"name":"Check out source","uses":"actions/checkout@v4"},{"name":"Set up Node.js","uses":"actions/setup-node@v4","with":{"node-version":22,"cache":"npm"}},{"name":"Install dependencies","run":"npm ci"},{"name":"Build release artifacts","run":"${{ matrix.command }}"},{"name":"Upload build artifacts","uses":"actions/upload-artifact@v4","with":{"name":"oryn-${{ matrix.artifact }}","path":"${{ matrix.path }}","if-no-files-found":"error","retention-days":14}}]},"release":{"name":"Publish GitHub Release","needs":"build","runs-on":"ubuntu-22.04","steps":[{"name":"Download build artifacts","uses":"actions/download-artifact@v4","with":{"pattern":"oryn-*","path":"release-assets","merge-multiple":true}},{"name":"Create checksums","shell":"bash","run":"cd release-assets\nfind . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt